# Remplace /etc/nginx/conf.d/default.conf de l'image nginx-unprivileged (port 8080, utilisateur non-root).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interne de Docker : résolution de "api" à l'exécution (et non au démarrage de nginx)
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }

    # Reverse proxy vers l'API : /api/health/ready -> http://api:8000/health/ready
    location /api/health/ {
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 130s;
    }

    # /metrics n'est jamais exposé publiquement
    location = /metrics { return 404; }
}
